<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan your trip — TripMind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<nav class="navbar navbar-expand-lg tm-navbar fixed-top py-3">
  <div class="container">
    <a class="navbar-brand tm-brand" href="index.html">Trip<span>Mind</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav1" style="border-color: var(--line);">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav1">
      <ul class="navbar-nav mx-auto gap-3">
        <li class="nav-item"><a class="nav-link active" href="planner.html">Plan a trip</a></li>
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="admin.html">Admin</a></li>
      </ul>
      <div class="d-flex" id="navUserSlot"></div>
    </div>
  </div>
</nav>

<main class="container" style="padding-top: 8rem; padding-bottom: 4rem;">
  <div class="row justify-content-center">
    <div class="col-lg-9">
      <div class="text-center mb-5 fade-up">
        <span class="badge-soft mb-2 d-inline-block">Step 1 of 3</span>
        <h1 class="display fw-bold">Tell AI what kind of journey you want</h1>
        <p class="text-mist">The more you share, the sharper your match scores.</p>
      </div>

      <div class="glass p-4 p-md-5 fade-up delay-1">
        <div id="plannerAlert"></div>
        <form id="plannerForm">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">📍 Travelling from</label>
              <input type="text" class="form-control" id="location" placeholder="e.g. Chennai" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">🗓️ Preferred month</label>
              <select class="form-select" id="travelMonth">
                <option value="">Any month</option>
                <option>January</option><option>February</option><option>March</option>
                <option>April</option><option>May</option><option>June</option>
                <option>July</option><option>August</option><option>September</option>
                <option>October</option><option>November</option><option>December</option>
              </select>
            </div>

            <div class="col-md-4">
              <label class="form-label">📅 Number of days</label>
              <input type="number" min="1" max="21" class="form-control" id="days" value="4" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">💰 Budget (₹)</label>
              <input type="number" min="1000" step="500" class="form-control" id="budget" value="25000" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">👥 Travelers</label>
              <input type="number" min="1" max="20" class="form-control" id="travelers" value="2" required>
            </div>

            <div class="col-md-6">
              <label class="form-label">🚶 Preferred pace</label>
              <select class="form-select" id="pace">
                <option>Relaxed</option>
                <option selected>Medium</option>
                <option>Fast-paced</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">🎒 Travel type</label>
              <select class="form-select" id="travelType">
                <option>Balanced</option>
                <option>Adventure</option>
                <option>Relaxed</option>
                <option>Cultural</option>
                <option>Romantic</option>
                <option>Fun</option>
              </select>
            </div>

            <div class="col-12 mt-4">
              <label class="form-label d-block mb-2">🌿 What do you like?</label>
              <div class="d-flex flex-wrap gap-2" id="interestPills">
                <!-- populated by JS -->
              </div>
            </div>

            <div class="col-md-6 mt-4">
              <label class="form-label">🍛 Food preference</label>
              <select class="form-select" id="food">
                <option>Any</option>
                <option>Vegetarian</option>
                <option>Non-Vegetarian</option>
                <option>Seafood</option>
                <option>Continental</option>
              </select>
            </div>
            <div class="col-md-6 mt-4">
              <label class="form-label">🏨 Accommodation</label>
              <select class="form-select" id="accommodation">
                <option>Budget</option>
                <option>Standard</option>
                <option>Luxury</option>
              </select>
            </div>
          </div>

          <div class="d-flex flex-wrap gap-3 mt-5">
            <button type="submit" class="btn btn-tm-primary btn-lg flex-grow-1" id="generateBtn">✨ Generate My Trip</button>
            <button type="button" class="btn btn-tm-sunset btn-lg" id="surpriseBtn">🎲 Surprise Me</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>

<footer class="tm-footer py-4 text-center">
  <div class="container">TripMind — AI-Powered Intelligent Travel Planning &amp; Personalized Itinerary Recommendation System</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/planner.js"></script>
</body>
</html>
